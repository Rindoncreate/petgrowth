name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check MoonBit
        run: moon check --target js --deny-warn
      - name: Test MoonBit
        run: moon test --target js --deny-warn
      - name: Build PWA
        run: node scripts/build.mjs
      - name: Check static output
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/sw.js
